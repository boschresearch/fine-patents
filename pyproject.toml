[project]
name = "whats-novel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valentin Knappich", email = "Valentin.Knappich@de.bosch.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "debugpy>=1.8.17",
    "hydralette>=0.2.4",
    "lxml-stubs>=0.5.1",
    "lxml>=6.0.2",
    "pyrootutils>=1.0.4",
    "python-epo-ops-client>=4.2.1",
    "tqdm>=4.67.1",
    "dspy>=3.0.3",
    "ipykernel>=6.30.1",
    "frontend>=0.0.3",
    "pymupdf>=1.26.4",
    "pillow>=11.3.0",
    "azure-identity>=1.25.0",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "rich>=14.1.0",
    "datasets>=4.3.0",
    "sentence-transformers>=5.1.2",
    "regex>=2025.9.18",
    "sparqlwrapper>=2.0.0",
    "sparql-dataframe>=0.4",
    "mineru-vl-utils>=0.1.16",
    "lingua-language-detector>=2.1.1",
    "pydantic>=2.11.9",
    "litellm<1.76.0",
    "aiofiles>=24.1.0",
    "matplotlib>=3.10.8",
    "cdifflib>=1.2.9",
    "vllm>=0.13.0",
    "transformers[torch]>=4.57.1",
    "krippendorff>=0.8.2",
    "rouge-score>=0.1.2",
    "rapidfuzz>=3.14.3",
    "ranx>=0.3.21",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]
